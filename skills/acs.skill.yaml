name: acs
version: "1.0"
description: >
  ACS (Access Control Server) domain skill covering EMV 3DS transaction flows,
  risk management configuration, and whitelist operations.

canonical_actions:
  - action: add_rba_adapter
    description: Add a Risk-Based Authentication adapter to the ACS
    params: []

  - action: create_risk_chain
    description: Create a risk evaluation chain
    params:
      - name: chainName
        required: false
        default: "default"

  - action: set_risk_score
    description: Configure frictionless/challenge score ranges
    params:
      - name: min
        required: true
        type: integer
      - name: max
        required: true
        type: integer
      - name: result
        required: false
        values: [frictionless, challenge, decline]

  - action: configure_issuer_settings
    description: Configure issuer settings before transactions
    params:
      - name: binRange
        required: false
      - name: defaultEmvVersion
        required: false
        values: ["2.1", "2.2", "2.3"]
      - name: challengePreference
        required: false
        values: [challenge, frictionless, auto]

  - action: disable_purchase_date_validation
    description: Disable purchaseDate validation in issuer settings
    params: []

  - action: configure_bin_range
    description: Configure issuer BIN range
    params:
      - name: binRange
        required: true

  - action: set_emv_version_default
    description: Set default EMV version in issuer settings
    params:
      - name: version
        required: true
        values: ["2.1", "2.2", "2.3"]

  - action: set_challenge_preference
    description: Set challenge preference in issuer settings
    params:
      - name: preference
        required: true
        values: [challenge, frictionless, auto]

  - action: run_transaction
    description: Execute a payment scheme transaction
    params:
      - name: scheme
        required: false
        values: [visa, mastercard, amex, jcb, discover]
      - name: version
        required: false
        values: ["2.1", "2.2", "2.3"]
      - name: amount
        required: false
      - name: currency
        required: false
      - name: cardNumber
        required: false
      - name: expiry
        required: false
      - name: cvv
        required: false
      - name: purchaseDate
        required: false
      - name: challengeIndicator
        required: false
      - name: cardholderName
        required: false
      - name: email
        required: false
      - name: merchantCategoryCode
        required: false
      - name: whitelist
        required: false

  - action: run_emv_transaction
    description: Execute an EMV 3DS specific transaction
    params:
      - name: version
        required: true
        values: ["2.1", "2.2", "2.3"]

  - action: verify_transaction_status
    description: Verify the ACS transaction authentication status
    params:
      - name: expected
        required: true
        values: [Y, C, N, U, R, A]
        description: EMVCo 3DS transaction status code

  - action: verify_ares
    description: Verify an ARes message field value
    params:
      - name: field
        required: false
      - name: expected
        required: true

  - action: verify_rreq
    description: Verify an RReq message field value
    params:
      - name: expected
        required: true

  - action: configure_whitelist
    description: Enable or configure whitelist on a BIN range
    params:
      - name: enabled
        required: false
        default: "true"

status_codes:
  Y: "Authentication Successful (Frictionless)"
  C: "Challenge Required"
  N: "Not Authenticated"
  U: "Authentication Could Not Be Performed"
  R: "Authentication Rejected"
  A: "Attempts Processing"
